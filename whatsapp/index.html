<body>
    <section class="landing">
        <div class="landing-inner">
            <img src="https://docs.telex.im/img/telex.webp" />
            <h2>Auto-Reply Whatsapp Customer Support Agent</h2>
            <p>Your AI Powered customer support superstar! 🌟🤩🌟</p>
            <p>You'll always reply to your customers on time <br />with this integration.<br /> Reply to your customers
                in
                one minute.<br /> Even when you're busy.<br />How? AI will do the job for you!.</p>
            <h1>Coming Soon!</h1>
            <div class="countdown"></div>
        </div>
    </section>
</body>
<script>
    const countdown = document.querySelector('.countdown');

    // Set Launch Date (ms)
    const launchDate = new Date('June 31, 2025 00:00:00').getTime();

    // Update every second
    const intvl = setInterval(() => {
        // Get todays date and time (ms)
        const now = new Date().getTime();

        // Distance from now and the launch date (ms)
        const distance = launchDate - now;

        // Time calculation
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Display result
        countdown.innerHTML = `
  <div>${days}<span>Days</span></div> 
  <div>${hours}<span>Hours</span></div>
  <div>${mins}<span>Minutes</span></div>
  <div>${seconds}<span>Seconds</span></div>
  `;

        // If launch date is reached
        if (distance < 0) {
            // Stop countdown
            clearInterval(intvl);
            // Style and output text
            countdown.style.color = '#17a2b8';
            countdown.innerHTML = 'Launched!';
        }
    }, 1000);

</script>
