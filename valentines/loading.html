<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(() => {
                window.location.href = "./boyfriend.html"
            }, 3000);
        });

    </script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #f1f1f1;
            height: 100vh;
        }

        .column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* HTML: <div class="loader"></div> */
        .loader {
            width: 60px;
            aspect-ratio: 1;
            background: linear-gradient(#dc1818 0 0) bottom/100% 0% no-repeat #ccc;
            -webkit-mask:
                radial-gradient(circle at 60% 65%, #000 62%, #0000 65%) top left,
                radial-gradient(circle at 40% 65%, #000 62%, #0000 65%) top right,
                linear-gradient(to bottom left, #000 42%, #0000 43%) bottom left,
                linear-gradient(to bottom right, #000 42%, #0000 43%) bottom right;
            mask:
                radial-gradient(circle at 60% 65%, #000 62%, #0000 65%) top left,
                radial-gradient(circle at 40% 65%, #000 62%, #0000 65%) top right,
                linear-gradient(to bottom left, #000 42%, #0000 43%) bottom left,
                linear-gradient(to bottom right, #000 42%, #0000 43%) bottom right;
            -webkit-mask-size: 50% 50%;
            mask-size: 50% 50%;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            animation: l19 2s infinite linear;
        }

        @keyframes l19 {

            90%,
            100% {
                background-size: 100% 100%
            }
        }
    </style>
</head>

<body>
    <div class="column">
        <div class="loader">
        </div>
    </div>
</body>
<footer>
    <p>&copy; 2025 Hire a Valentine for Valentine's. All rights reserved.</p>
</footer>

</html>
