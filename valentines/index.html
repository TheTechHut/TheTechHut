<body>
    <div class="container">
        <header>
            <h1>Hire a Valentine for Valentine's Day</h1>
            <p>Make this Valentine's Day unforgettable with the perfect companion!</p>
        </header>

        <!-- Marquee section for possible Valentines -->
        <section class="Valentine-marquee">
            <marquee behavior="scroll" direction="left">
                Available Valentines: Faith, Sasha, Anita, Alex, Robi, and more! 🌹
            </marquee>
        </section>

        <main>
            <form id="valentineform" action="https://formspree.io/f/myzkdlqo" method="POST">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="date">Preferred Date:</label>
                <input type="date" id="date" name="date" required>

                <label for="preferences">Your Preferences:</label>
                <textarea id="preferences" name="preferences" rows="4"
                    placeholder="Describe your ideal companion..."></textarea>

                <button type="submit" href="./boyfriend.html">Find My Date</button>
            </form>
        </main>
