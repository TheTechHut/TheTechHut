name: Capture LIVE community page OG screenshots

on:
  push:
    branches:
      - chore/redesign
    paths:
      - 'communities_test.html'
      - 'communities_test_2.html'
      - 'communities_test_3.html'
      - '.github/workflows/community-og-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-og-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install desktop Chromium and image tools
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium

      - name: Capture the actual public pages (never localhost)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          from PIL import Image
          from playwright.sync_api import sync_playwright

          pages = {
              'communities_test': 'Your next opportunity',
              'communities_test_2': 'Your shortcut to the right tech',
              'communities_test_3': 'The Ultimate Tech Plug',
          }
          base = 'https://thetechhut.co/'
          target = Path('assets/img/social')
          target.mkdir(parents=True, exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={'width': 1440, 'height': 756},
                  device_scale_factor=1,
                  color_scheme='light',
                  locale='en-KE',
                  reduced_motion='reduce',
              )
              for name, expected in pages.items():
                  url = base + name + '.html'
                  response = page.goto(url, wait_until='networkidle', timeout=60000)
                  if response is None or response.status != 200:
                      raise RuntimeError(f'{url}: expected HTTP 200, received {response.status if response else "no response"}')
                  actual = urlparse(page.url)
                  if actual.hostname not in ('thetechhut.co', 'www.thetechhut.co'):
                      raise RuntimeError(f'{url}: unexpected redirect to {page.url}')
                  if actual.path.rstrip('/') != '/' + name + '.html':
                      raise RuntimeError(f'{url}: wrong landing page {page.url}')
                  heading = page.locator('h1').first
                  heading.wait_for(state='visible', timeout=10000)
                  headline = heading.inner_text().strip()
                  if expected.lower() not in headline.lower():
                      raise RuntimeError(f'{url}: page heading mismatch: {headline!r}')
                  page.evaluate('document.fonts.ready')
                  page.wait_for_timeout(1300)
                  png = Path('/tmp') / f'{name}-live.png'
                  page.screenshot(path=str(png), full_page=False, animations='disabled')
                  jpg = target / f'{name}-og.jpg'
                  with Image.open(png) as im:
                      im.convert('RGB').resize((1200, 630), Image.Resampling.LANCZOS).save(
                          jpg, 'JPEG', quality=89, optimize=True, progressive=True
                      )
                  print(f'LIVE screenshot verified: {url} | heading: {headline} | file: {jpg} | bytes: {jpg.stat().st_size}')
              browser.close()
          PY

      - name: Commit the live screenshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/social/communities_test-og.jpg \
                  assets/img/social/communities_test_2-og.jpg \
                  assets/img/social/communities_test_3-og.jpg
          if git diff --cached --quiet; then
            echo "Images are unchanged"
          else
            git commit -m "Replace local community OG images with screenshots of live website"
            git push origin HEAD:chore/redesign
          fi
