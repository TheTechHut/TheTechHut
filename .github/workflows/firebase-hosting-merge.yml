# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - chore/redesign

# One deploy at a time, shared with jobs-board.yml and jobs-snapshot.yml, so a
# push cannot land on top of a data deploy (or the reverse).
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # data/jobs-board.json and jobs/role/ are built, never committed (see
      # .gitignore). A deploy without them removes them from the live site, so
      # build them here too. If the feeds are down the deploy still goes ahead,
      # and the jobs page reads the feeds live as it always did.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the jobs board data
        id: board
        continue-on-error: true
        run: node scripts/build_jobs_board.js
      - name: Install the image libraries for the share cards
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5 opentype.js@1.3.4

      - name: Write one page per role (jobs/role/)
        if: steps.board.outcome == 'success'
        continue-on-error: true
        run: node scripts/build_job_pages.js

      # hackathons/event/ is built, never committed, and /hackathons/ links to it.
      - name: Write one page per hackathon (hackathons/event/)
        continue-on-error: true
        run: node scripts/build_hackathon_pages.js

      # One page and share card per prompt, plus prompts/sitemap.xml: built, never committed.
      - name: Write the prompt pages, share cards and sitemap
        continue-on-error: true
        run: node scripts/build_prompt_pages.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_STUDY_PAL }}'
          channelId: live
          projectId: ai-study-pal

      # Cloudflare sits in front of Firebase and keeps its own copy of CSS, JS
      # and images, which Firebase's deploy does not clear. Clear it, so a
      # change to an unversioned file (assets/css/thh.css) shows at once.
      # Needs two repository secrets: CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN
      # (a token with Zone > Cache Purge for thetechhut.co). Skipped without them.
      - name: Clear Cloudflare's cache
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then echo "No Cloudflare secrets; skipping the purge"; exit 0; fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -q '"success":true' && echo "Cloudflare cache cleared" || { echo "Cloudflare purge failed"; exit 1; }
