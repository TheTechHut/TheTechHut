<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | The Tech Hut games</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://thetechhut.co/games/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/img/favicon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&amp;family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/thh.css">
    <style>
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; margin: 0; background: #0b1418; overflow: hidden; }
        .pbar { display: flex; align-items: center; gap: 10px 18px; padding: 8px 16px; background: var(--ink); color: #fff; flex-wrap: wrap; }
        .pbar .wordmark { color: #fff; font-size: 19px; text-decoration: none; white-space: nowrap; }
        .pbar .wordmark .dot { color: var(--mint); }
        .ptitle { flex: 1 1 200px; min-width: 0; font-family: var(--sans); line-height: 1.25; }
        .ptitle b { display: block; color: #fff; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ptitle span { display: block; font-size: 12.5px; color: #b9d3dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pact { display: flex; gap: 8px; flex-wrap: wrap; }
        .pact a, .pact button { font: 600 13.5px var(--sans); color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.45);
            border-radius: 3px; padding: 7px 11px; text-decoration: none; cursor: pointer; white-space: nowrap; }
        .pact a:hover, .pact button:hover { border-color: var(--mint); color: var(--mint); }
        .pact .go { background: var(--mint); border-color: var(--mint); color: var(--ink); }
        .pact .go:hover { color: var(--ink); background: var(--mint-2); }
        .stage { flex: 1; position: relative; min-height: 0; background: #000; }
        .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
        .stage:fullscreen iframe { inset: 0; }
        .pnote { position: absolute; left: 0; right: 0; bottom: 0; padding: 7px 16px; font: 13px var(--sans); color: #cfe0e6;
            background: rgba(7,59,76,.92); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
        .pnote a { color: var(--mint); }
        .pnote button { background: none; border: 0; color: #cfe0e6; font-size: 18px; cursor: pointer; line-height: 1; }
        .poff { margin: auto; max-width: 560px; padding: 40px 20px; color: #fff; font-family: var(--sans); text-align: left; }
        .poff h1 { color: #fff; font-size: clamp(28px, 5vw, 40px); margin: 6px 0 8px; }
        .poff .cat { font: 500 12px var(--mono); color: var(--mint); text-transform: uppercase; letter-spacing: .06em; }
        .poff p { color: #cfe0e6; font-size: 17px; }
        .poff .btn { margin: 8px 10px 0 0; }
        .poff .btn.ghost { color: #fff; border-color: #fff; }
        @media (max-width: 560px) { .pbar .wordmark { display: none; } .pact a.all { display: none; } }
    </style>
</head>

<body>
    <div class="pbar">
        <a class="wordmark" href="/">The Tech Hut<span class="dot">.</span></a>
        <div class="ptitle"><b id="gname">Games</b><span id="gby"></span></div>
        <div class="pact" id="pact">
            <a class="all" href="/games/">All games</a>
        </div>
    </div>
    <div class="stage" id="stage"></div>

    <script src="/assets/js/games-data.js?v=20261022"></script>
    <script>
    (function () {
        var D = window.TTHGames, catName = {};
        D.CATS.forEach(function (c) { catName[c[0]] = c[1]; });
        var m = /[?&]g=([a-z0-9-]+)/.exec(location.search);
        var g = m && D.GAMES.filter(function (x) { return x.slug === m[1]; })[0];
        var stage = document.getElementById('stage'), pact = document.getElementById('pact');

        function el(tag, attrs, text) {
            var e = document.createElement(tag);
            for (var k in attrs) e.setAttribute(k, attrs[k]);
            if (text) e.textContent = text;
            return e;
        }
        function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

        if (!g) {
            document.getElementById('gname').textContent = 'Game not found';
            var box = el('div', { 'class': 'poff' });
            box.appendChild(el('h1', {}, 'We couldn’t find that game.'));
            box.appendChild(el('p', {}, 'It may have moved or been taken off the list.'));
            box.appendChild(el('a', { 'class': 'btn mint', href: '/games/' }, 'See all games'));
            stage.appendChild(box);
            return;
        }

        document.title = g.name + ' | Play free in your browser | The Tech Hut';
        document.getElementById('gname').textContent = g.name;
        document.getElementById('gby').textContent = g.by;
        var ext = el('a', { href: g.url, target: '_blank', rel: 'noopener' }, 'Open on ' + host(g.url) + ' ↗');

        if (g.embed) {
            var fs = el('button', { type: 'button' }, 'Full screen');
            fs.addEventListener('click', function () {
                var f = stage.requestFullscreen || stage.webkitRequestFullscreen;
                if (f) f.call(stage); else window.open(g.url, '_blank', 'noopener');
            });
            pact.insertBefore(fs, pact.firstChild);
            pact.insertBefore(ext, fs);
            var frame = el('iframe', {
                src: g.url,
                title: g.name,
                allow: 'fullscreen; gamepad; autoplay; clipboard-write',
                allowfullscreen: '',
                referrerpolicy: 'strict-origin-when-cross-origin',
                sandbox: 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-modals allow-orientation-lock'
            });
            stage.appendChild(frame);
            var note = el('div', { 'class': 'pnote' });
            var span = el('span', {}, (g.phone ? '' : 'Best with a keyboard. ') + 'Game not loading or saving? ');
            var a2 = el('a', { href: g.url, target: '_blank', rel: 'noopener' }, 'Play it on ' + host(g.url));
            span.appendChild(a2);
            var x = el('button', { type: 'button', 'aria-label': 'Hide this note' }, '×');
            x.addEventListener('click', function () { note.remove(); });
            note.appendChild(span); note.appendChild(x);
            stage.appendChild(note);
            setTimeout(function () { if (note.parentNode) note.remove(); }, 12000);
            frame.focus();
        } else {
            // This maker doesn't allow its game inside other sites, so send players to the source.
            ext.className = 'go';
            pact.insertBefore(ext, pact.firstChild);
            document.body.style.overflow = 'auto';
            var off = el('div', { 'class': 'poff' });
            off.appendChild(el('span', { 'class': 'cat' }, catName[g.cat] || ''));
            off.appendChild(el('h1', {}, g.name));
            off.appendChild(el('p', {}, g.line));
            off.appendChild(el('p', {}, g.name + ' plays on its own site, ' + host(g.url) + ', which doesn’t allow it to be shown inside other pages. It opens in a new tab.'));
            off.appendChild(el('a', { 'class': 'btn mint', href: g.url, target: '_blank', rel: 'noopener' }, 'Play on ' + host(g.url) + ' ↗'));
            off.appendChild(el('a', { 'class': 'btn ghost', href: '/games/' }, 'All games'));
            stage.appendChild(off);
            stage.style.display = 'flex'; stage.style.background = '#0b1418';
        }
    })();
    </script>
</body>

</html>
