<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tell Your Story</title>
    <link rel="canonical" href="https://thetechhut.co/stories/">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>Tell Your Story!</h1>
        <form id="storyForm" action="https://formspree.io/f/xrbgbddv" method="POST">
            <input name="email" type="email" placeholder="Your Email" required>
            <input name="Whatsapp Number" type="tel" placeholder="Whatsapp Number" required>
            <textarea name="user story" rows="10" placeholder="Share your story..." required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="./script.js"></script>
</body>

</html>
