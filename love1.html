<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question for You ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff5f5;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scroll during button movement */
        }
        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }
        .container-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(255, 182, 193, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid #ffe3e3;
        }
        .btn-yes {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-no {
            transition: all 0.2s ease;
        }
        .hidden { display: none; }
        
        .floating-heart {
            position: absolute;
            color: #ff4d6d;
            animation: float-up 4s linear infinite;
            opacity: 0;
            z-index: -1;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative bg-gradient-to-br from-pink-50 to-red-50">

    <div class="container-box z-10" id="main-container">
        <!-- Proposal View -->
        <div id="proposal-view">
            <div class="mb-6 relative">
                <img id="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp4NnBqZ3R4bmV4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnFvPTEx/KztT2c4u8mYYUiMKdJ/giphy.gif" 
                     alt="Cute bear asking" class="mx-auto w-56 h-56 rounded-2xl object-cover shadow-inner">
            </div>
            
            <h1 id="headline" class="romantic-font text-5xl text-red-600 mb-4">Will you be my Valentine?</h1>
            <p id="subtext" class="text-pink-500 font-medium mb-10 italic">I have a very special place in my heart for you...</p>

            <div class="flex flex-col items-center gap-6">
                <button id="yes-btn" class="btn-yes bg-gradient-to-r from-pink-500 to-red-500 hover:from-pink-600 hover:to-red-600 text-white font-bold py-4 px-12 rounded-full text-xl shadow-xl transform active:scale-95">
                    YES! 💖
                </button>
                <button id="no-btn" class="btn-no bg-gray-200 hover:bg-gray-300 text-gray-600 font-semibold py-2 px-8 rounded-full text-base transition-all">
                    No
                </button>
            </div>
        </div>

        <!-- Success View -->
        <div id="success-view" class="hidden">
            <div class="mb-6">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp4NnBqZ3R4bmV4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnFvPTEx/L8u6x58pW7W585mEup/giphy.gif" 
                     alt="Happy couple" class="mx-auto w-56 h-56 rounded-2xl object-cover">
            </div>
            <h1 class="romantic-font text-6xl text-red-600 mb-4">Hehehe, I knew it!</h1>
            <p class="text-2xl text-pink-600 font-bold mb-6">See you on the 14th, my love! ❤️</p>
            <div class="animate-bounce text-4xl">🌹✨🥂✨🌹</div>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const proposalView = document.getElementById('proposal-view');
        const successView = document.getElementById('success-view');
        const mainGif = document.getElementById('main-gif');
        const headline = document.getElementById('headline');

        let yesScale = 1;
        let noClickCount = 0;

        const noTexts = [
            "Are you sure? 🥺",
            "Really sure??",
            "Think about it again!",
            "Don't do this to me...",
            "I'm gonna cry... 😭",
            "You're breaking my heart",
            "PLEASE??",
            "I'll be very sad...",
            "Okay, last chance!",
            "Stop clicking this! Click YES!"
        ];

        // Create background hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.innerHTML = ['❤️', '💖', '💝', '💕', '🌸'][Math.floor(Math.random() * 5)];
            heart.className = 'floating-heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }, 300);

        noBtn.addEventListener('click', () => {
            noClickCount++;
            
            // Make the YES button grow massive
            yesScale += 0.5;
            yesBtn.style.transform = `scale(${yesScale})`;
            
            // Move the NO button randomly to make it hard to click
            if(noClickCount >= 1) {
                const padding = 100;
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding) + padding/2;
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding) + padding/2;
                
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
                noBtn.style.zIndex = '100';
            }

            // Update text to be more persuasive
            if(noClickCount < noTexts.length) {
                noBtn.innerText = noTexts[noClickCount];
            } else {
                noBtn.innerText = "Fine, you win... but try clicking YES!";
                noBtn.style.opacity = '0.5';
            }

            // Change images to show "sadness"
            if(noClickCount === 2) {
                mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp4NnBqZ3R4bmV4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnFvPTEx/j1XcxnE4yV1x0r8BTo/giphy.gif";
            }
            if(noClickCount === 5) {
                mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp4NnBqZ3R4bmV4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnFvPTEx/7SF5scGB2AFrO/giphy.gif";
            }
        });

        yesBtn.addEventListener('click', () => {
            proposalView.classList.add('hidden');
            successView.classList.remove('hidden');
            
            // Infinite heart celebration
            setInterval(createExplosion, 200);
        });

        function createExplosion() {
            for(let i=0; i<10; i++) {
                const heart = document.createElement('div');
                heart.innerText = '💖';
                heart.style.position = 'fixed';
                heart.style.left = '50%';
                heart.style.top = '50%';
                heart.style.fontSize = '24px';
                heart.style.transition = 'all 1s ease-out';
                document.body.appendChild(heart);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 300 + 100;
                
                setTimeout(() => {
                    heart.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                    heart.style.opacity = '0';
                }, 10);

                setTimeout(() => heart.remove(), 1000);
            }
        }
    </script>
</body>
</html>
