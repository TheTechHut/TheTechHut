<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tech Hut Apprenticeship Announcer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #093e76 0%, #118AB2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .canvas-container {
            border: 2px solid #fff;
            border-radius: 0.75rem;
            overflow: hidden;
            background-color: #093e76;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
                background-color: #2ecc71; /* Brand Green */
                color: white;
                padding: 0.75rem 1.5rem;
                border-radius: 0.5rem;
                cursor: pointer;
                transition: background-color 0.3s ease;
                font-weight: 600;
                text-align: center;
            }
        .custom-file-upload:hover {
            background-color: #27ae60; /* Darker green on hover */
        }
        .btn-action {
            background-color: #d6a811; /* Brand Yellow */
            color: #073B4C; /* Dark text for contrast (from previous palette, good contrast) */
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .btn-action:hover {
            background-color: #c0970f; /* Darker yellow on hover */
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container flex flex-col lg:flex-row gap-8">
        <div class="lg:w-1/2 flex flex-col items-center justify-center p-4">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-6 text-center">Create Your Apprenticeship Announcer!</h1>
            <p class="text-lg text-center mb-8 opacity-90">Upload your profile picture and enter your name to generate a custom image announcing you're attending The Tech Hut Apprenticeship!</p>

            <div class="mb-6 w-full">
                <label for="profilePictureInput" class="custom-file-upload block w-full text-center">
                    Upload Your Profile Picture
                </label>
                <input type="file" id="profilePictureInput" accept="image/*">
                <p id="fileNameDisplay" class="text-sm text-gray-300 mt-2 text-center"></p>
            </div>

            <div class="mb-6 w-full">
                <input type="text" id="userNameInput" class="text-input" placeholder="Enter your name (e.g., Erick)">
            </div>

            <div class="flex flex-col md:flex-row gap-4 w-full">
                <button id="generateImageBtn" class="btn-action w-full flex items-center justify-center gap-2">
                    Generate Image
                    <div id="loadingSpinner" class="loading-spinner"></div>
                </button>
                <button id="downloadImageBtn" class="btn-action w-full" disabled>
                    Download Image
                </button>
            </div>
        </div>

        <div class="lg:w-1/2 flex flex-col justify-center items-center p-4">
            <!-- Clickable Logo above the canvas -->
            <a href="https://thetechhut.co/apprenticeship" target="_blank" class="mb-4">
                <img src="https://lh3.googleusercontent.com/pw/AP1GczPO77UNd-ZVSZkCGhvqMSXFL3hy0lFko9RvSLKfjeXTt92Q2IB9C1ZBF6AqOrfWf-hw1A8Moz7M9cgGfzpnqGSPmoFHNLBRb2eh3JaOHvXZz7RYi9FK6yItIZwbpcy2TYCJH0bu3lNAzrSQA5qbwp-U=w1080-h1080-s-no-gm?authuser=0" 
                     alt="The Tech Hut Apprenticeship Logo" 
                     class="w-[75px] h-auto rounded-lg shadow-md"
                     crossorigin="anonymous">
            </a>
            <div class="canvas-container w-full h-auto">
                <canvas id="posterCanvas" width="1200" height="1500"></canvas> <!-- Adjusted canvas height for portrait -->
            </div>
        </div>
    </div>

    <script>
        const profilePictureInput = document.getElementById('profilePictureInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const userNameInput = document.getElementById('userNameInput'); // New: Get name input
        const generateImageBtn = document.getElementById('generateImageBtn');
        const downloadImageBtn = document.getElementById('downloadImageBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');

        let profileImage = null;
        
        const kenyaFlag = new Image();
        kenyaFlag.crossOrigin = 'anonymous';
        kenyaFlag.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Flag_of_Kenya.svg/1200px-Flag_of_Kenya.svg.png'; // Kenya flag URL
        let flagLoaded = false;

        kenyaFlag.onload = () => {
            flagLoaded = true;
            drawImage();
        };
        kenyaFlag.onerror = (e) => {
            console.error("Failed to load Kenya flag image:", e);
            flagLoaded = false;
            drawImage();
        };

        // Confetti animation variables
        let confettiParticles = [];
        const confettiColors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#2ecc71', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722', '#795548', '#9E9E9E', '#607D8B', '#d6a811']; // Added brand yellow

        function createConfettiParticle(x, y) {
            return {
                x: x,
                y: y,
                color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                radius: Math.random() * 5 + 2,
                velocity: {
                    x: (Math.random() - 0.5) * 10,
                    y: Math.random() * 10 + 5
                },
                alpha: 1,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 10
            };
        }

        function updateConfetti() {
            for (let i = 0; i < confettiParticles.length; i++) {
                let p = confettiParticles[i];
                p.x += p.velocity.x;
                p.y += p.velocity.y;
                p.velocity.y += 0.5;
                p.alpha -= 0.01;
                p.rotation += p.rotationSpeed;

                if (p.alpha <= 0 || p.y > canvas.height) {
                    confettiParticles.splice(i, 1);
                    i--;
                }
            }
        }

        function drawConfetti() { 
            for (let i = 0; i < confettiParticles.length; i++) {
                let p = confettiParticles[i];
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.radius / 2, -p.radius / 2, p.radius, p.radius); // Draw as squares for simplicity
                ctx.restore();
            }
        }

        let animationFrameId = null;

        function animate() {
            drawImage();
            updateConfetti();
            drawConfetti();
            animationFrameId = requestAnimationFrame(animate);
        }

        animate(); // Start the animation loop initially

        profilePictureInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = `File: ${file.name}`;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        profileImage = img;
                        drawImage();
                        downloadImageBtn.disabled = false;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                fileNameDisplay.textContent = '';
                profileImage = null;
                drawImage();
                downloadImageBtn.disabled = true;
            }
        });

        userNameInput.addEventListener('input', drawImage); // New: Update canvas on name input

        generateImageBtn.addEventListener('click', () => {
            loadingSpinner.style.display = 'inline-block';
            generateImageBtn.disabled = true;
            
            confettiParticles = [];
            const numConfetti = 200;
            for (let i = 0; i < numConfetti; i++) {
                confettiParticles.push(createConfettiParticle(Math.random() * canvas.width, -Math.random() * canvas.height));
            }

            if (!animationFrameId) {
                animationFrameId = requestAnimationFrame(animate);
            }

            setTimeout(() => {
                downloadImageBtn.disabled = false;
                loadingSpinner.style.display = 'none';
                generateImageBtn.disabled = false;
            }, 2000);
        });

        downloadImageBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'tech-hut-apprenticeship-announcement.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function drawImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const borderRadius = 30;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(borderRadius, 0);
            ctx.lineTo(canvas.width - borderRadius, 0);
            ctx.quadraticCurveTo(canvas.width, 0, canvas.width, borderRadius);
            ctx.lineTo(canvas.width, canvas.height - borderRadius);
            ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - borderRadius, canvas.height);
            ctx.lineTo(borderRadius, canvas.height);
            ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - borderRadius);
            ctx.lineTo(0, borderRadius);
            ctx.quadraticCurveTo(0, 0, borderRadius, 0);
            ctx.closePath();
            ctx.clip();

            // Background Gradient using Tech Hut brand blues
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#093e76'); // Dark blue
            gradient.addColorStop(1, '#118AB2'); // Slightly lighter blue
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add abstract shapes/lines from the background of the provided image
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; // Lighter white for background lines
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.7, 0);
            ctx.lineTo(canvas.width * 0.9, canvas.height * 0.3);
            ctx.lineTo(canvas.width * 0.6, canvas.height * 0.5);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.8);
            ctx.lineTo(canvas.width * 0.3, canvas.height * 0.9);
            ctx.lineTo(canvas.width * 0.5, canvas.height);
            ctx.stroke();

            // Draw Power Learn Project logo (top left) - No logo drawn on canvas as per previous request
            // The HTML img tag handles the logo outside the canvas.

            // Draw Kenya Flag (top right)
            if (flagLoaded) {
                const flagWidth = 100;
                const flagHeight = (kenyaFlag.height / kenyaFlag.width) * flagWidth;
                ctx.drawImage(kenyaFlag, canvas.width - flagWidth - 50, 50, flagWidth, flagHeight);
            }

            // "I Got Accepted" text
            ctx.font = 'italic bold 100px "Playfair Display"'; // Use a more elegant, italic font
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText("I Got Accepted", canvas.width / 2, 350);

            // "The Tech Hut Apprenticeship scholarship" text
            ctx.font = 'normal 40px Inter';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText("The Tech Hut Apprenticeship", canvas.width / 2, 420);
            ctx.fillText("Scholarship", canvas.width / 2, 470);

            // Profile Picture Circle (centered)
            const circleX = canvas.width / 2;
            const circleY = 750; // Adjusted Y position for the circle
            const circleRadius = 200;

            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.fillStyle = '#ffffff'; // White circle background
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 8;
            ctx.shadowOffsetY = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Draw profile picture inside the circle or placeholder text
            if (profileImage) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(circleX, circleY, circleRadius - 5, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.clip();

                const aspectRatio = profileImage.width / profileImage.height;
                let imgWidth = circleRadius * 2;
                let imgHeight = circleRadius * 2;

                if (aspectRatio > 1) {
                    imgHeight = imgWidth / aspectRatio;
                } else {
                    imgWidth = imgHeight * aspectRatio;
                }

                const imgX = circleX - imgWidth / 2;
                const imgY = circleY - imgHeight / 2;

                ctx.drawImage(profileImage, imgX, imgY, imgWidth, imgHeight);
                ctx.restore();
            } else {
                ctx.save();
                ctx.beginPath();
                ctx.arc(circleX, circleY, circleRadius - 5, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.clip();

                ctx.font = 'bold 40px Inter';
                ctx.fillStyle = '#073B4C';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Upload', circleX, circleY - 20);
                ctx.fillText('Your Photo', circleX, circleY + 20);
                ctx.restore();
            }

            // Name text (dynamically from input)
            const userName = userNameInput.value.trim();
            if (userName) {
                ctx.font = 'bold 50px Inter';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(userName.toUpperCase(), canvas.width / 2, 1050); // Adjusted Y position
            } else {
                ctx.font = 'bold 50px Inter';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText("YOUR NAME", canvas.width / 2, 1050); // Placeholder if no name entered
            }
            

            // "#UnleashYourGreatness" hashtag
            ctx.font = 'bold 35px Inter';
            ctx.fillStyle = '#2ecc71'; // Vibrant green for hashtag
            ctx.textAlign = 'center';
            ctx.fillText("#UnleashYourGreatness", canvas.width / 2, 1150); // Adjusted Y position

            // "I can't wait to discover my potential and unleash my great!"
            ctx.font = 'normal 30px Inter';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText("I can't wait to discover my potential", 80, canvas.height - 200);
            ctx.fillText("and unleash my greatness!", 80, canvas.height - 150);

            // New banner at the bottom
            const bannerHeight = 100; // Increased height for two lines of text
            const bannerY = canvas.height - bannerHeight;
            const bannerTextLine1 = "Join me now in this journey:";
            const bannerTextLine2 = "Visit thetechhut.co/apprenticeship to apply now.";

            ctx.fillStyle = '#093e76'; // Dark blue for banner background
            ctx.fillRect(0, bannerY, canvas.width, bannerHeight);

            ctx.font = 'bold 25px Inter'; // Adjust font size as needed
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(bannerTextLine1, canvas.width / 2, bannerY + bannerHeight / 2 - 15); 

            ctx.font = 'bold 25px Inter'; 
            ctx.fillStyle = '#d6a811'; // Brand Yellow for the link
            ctx.fillText(bannerTextLine2, canvas.width / 2, bannerY + bannerHeight / 2 + 15); 

            ctx.restore(); // Restore the context after clipping for the entire canvas content
        }
</script>
</body>
</html>
<!-- End of HTML Document -->
<!-- This HTML document creates a custom image generator for The Tech Hut Apprenticeship announcement, allowing users to upload their profile picture, enter their name, and generate a personalized announcement image with a vibrant design, including confetti animation and a clickable logo. The generated image can be downloaded as a PNG file. -->
