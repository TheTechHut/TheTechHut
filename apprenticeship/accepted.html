    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Using Tech Hut brand blues for background */
            background: linear-gradient(135deg, #093e76 0%, #118AB2 100%); /* Dark blue to slightly lighter blue gradient */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1); /* Slightly transparent white */
            backdrop-filter: blur(10px); /* Frosted glass effect */
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .canvas-container {
            border: 2px solid #fff;
            border-radius: 0.75rem; /* Applied to the container */
            overflow: hidden;
            background-color: #093e76; /* Base color for canvas background, matching brand blue */
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto; /* Maintain aspect ratio */
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
                background-color: #2ecc71; /* Brand Green */
                color: white;
                padding: 0.75rem 1.5rem;
                border-radius: 0.5rem;
                cursor: pointer;
                transition: background-color 0.3s ease;
                font-weight: 600;
                text-align: center;
            }
        .custom-file-upload:hover {
            background-color: #27ae60; /* Darker green on hover */
        }
        .btn-action {
            background-color: #d6a811; /* Brand Yellow */
            color: #073B4C; /* Dark text for contrast (from previous palette, good contrast) */
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .btn-action:hover {
            background-color: #c0970f; /* Darker yellow on hover */
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden by default */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container flex flex-col lg:flex-row gap-8">
        <div class="lg:w-1/2 flex flex-col items-center justify-center p-4">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-6 text-center">Create Your Apprenticeship Announcer!</h1>
            <p class="text-lg text-center mb-8 opacity-90">Upload your profile picture and generate a custom image to announce you're attending The Tech Hut Apprenticeship!</p>

            <div class="mb-6 w-full">
                <label for="profilePictureInput" class="custom-file-upload block w-full text-center">
                    Upload Your Profile Picture
                </label>
                <input type="file" id="profilePictureInput" accept="image/*">
                <p id="fileNameDisplay" class="text-sm text-gray-300 mt-2 text-center"></p>
            </div>

            <div class="flex flex-col md:flex-row gap-4 w-full">
                <button id="generateImageBtn" class="btn-action w-full flex items-center justify-center gap-2">
                    Generate Image
                    <div id="loadingSpinner" class="loading-spinner"></div>
                </button>
                <button id="downloadImageBtn" class="btn-action w-full" disabled>
                    Download Image
                </button>
            </div>
        </div>

        <div class="lg:w-1/2 flex flex-col justify-center items-center p-4">
            <!-- Removed clickable logo image from here -->
            <div class="canvas-container w-full h-auto">
                <canvas id="posterCanvas" width="1200" height="630"></canvas>
            </div>
        </div>
    </div>

    <script>
        const profilePictureInput = document.getElementById('profilePictureInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const generateImageBtn = document.getElementById('generateImageBtn');
        const downloadImageBtn = document.getElementById('downloadImageBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');

        let profileImage = null; // Initialize profileImage as null
        // Removed logoImage declaration and loading logic as it's no longer used
        
        // Initial draw when page loads, showing placeholder text
        drawImage();

        profilePictureInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = `File: ${file.name}`;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        profileImage = img;
                        drawImage();
                        downloadImageBtn.disabled = false;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                fileNameDisplay.textContent = '';
                profileImage = null; // Set to null if no file selected
                drawImage(); // Redraw with placeholder text
                downloadImageBtn.disabled = true;
            }
        });

        generateImageBtn.addEventListener('click', () => {
            loadingSpinner.style.display = 'inline-block'; // Show spinner
            generateImageBtn.disabled = true; // Disable button during generation
            setTimeout(() => { // Simulate a short processing time
                drawImage();
                downloadImageBtn.disabled = false;
                loadingSpinner.style.display = 'none'; // Hide spinner
                generateImageBtn.disabled = false; // Re-enable button
            }, 500);
        });

        downloadImageBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'tech-hut-apprenticeship-announcement.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function drawImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const borderRadius = 30; // Define a consistent border radius for the canvas content

            // Clip the entire canvas content to have rounded corners
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(borderRadius, 0);
            ctx.lineTo(canvas.width - borderRadius, 0);
            ctx.quadraticCurveTo(canvas.width, 0, canvas.width, borderRadius);
            ctx.lineTo(canvas.width, canvas.height - borderRadius);
            ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - borderRadius, canvas.height);
            ctx.lineTo(borderRadius, canvas.height);
            ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - borderRadius);
            ctx.lineTo(0, borderRadius);
            ctx.quadraticCurveTo(0, 0, borderRadius, 0);
            ctx.closePath();
            ctx.clip();

            // Background Gradient (using Tech Hut brand blues)
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#093e76'); // Dark blue
            gradient.addColorStop(1, '#118AB2'); // Slightly lighter blue (from previous palette, blends well)
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add subtle background circles/patterns
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; // Very light white for subtle patterns
            ctx.lineWidth = 2;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 50 + Math.random() * 150, 0, Math.PI * 2);
                ctx.stroke();
            }

            // "I'M ATTENDING..." text
            ctx.font = 'bold 55px Inter'; /* Slightly larger */
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText("I'M ATTENDING...", 80, 100);

            // Main Announcement Text: "THE TECH HUT APPRENTICESHIP"
            ctx.font = 'bold 75px Inter'; /* Made smaller */
            ctx.fillStyle = '#d6a811'; // Brand Yellow/Gold for emphasis
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)'; /* Subtle shadow */
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            ctx.fillText("THE TECH HUT", 80, 250); 
            ctx.fillText("APPRENTICESHIP", 80, 330); /* Adjusted Y position for smaller font */
            ctx.shadowBlur = 0; /* Reset shadow */
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Call to action text
            ctx.font = 'bold 45px Inter'; /* Slightly larger */
            ctx.fillStyle = '#ffffff';
            ctx.fillText("UNLEASH YOUR GREATNESS!", 80, 430); /* Adjusted Y position */

            // Draw the profile picture circle
            const circleX = canvas.width - 250;
            const circleY = canvas.height / 2;
            const circleRadius = 150;

            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.fillStyle = '#ffffff'; // White circle background
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)'; /* Add shadow to circle */
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 8;
            ctx.shadowOffsetY = 8;
            ctx.fill();
            ctx.shadowBlur = 0; /* Reset shadow */
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Draw profile picture inside the circle or placeholder text
            if (profileImage) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(circleX, circleY, circleRadius - 5, 0, Math.PI * 2, true); // Slightly smaller circle for image
                ctx.closePath();
                ctx.clip(); // Clip to the circle

                // Calculate image position and size to fit and center within the circle
                const aspectRatio = profileImage.width / profileImage.height;
                let imgWidth = circleRadius * 2;
                let imgHeight = circleRadius * 2;

                if (aspectRatio > 1) { // Image is wider than tall
                    imgHeight = imgWidth / aspectRatio;
                } else { // Image is taller than wide
                    imgWidth = imgHeight * aspectRatio;
                }

                const imgX = circleX - imgWidth / 2;
                const imgY = circleY - imgHeight / 2;

                ctx.drawImage(profileImage, imgX, imgY, imgWidth, imgHeight);
                ctx.restore();
            } else {
                // Draw placeholder text if no image is uploaded
                ctx.save();
                ctx.beginPath();
                ctx.arc(circleX, circleY, circleRadius - 5, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.clip();

                ctx.font = 'bold 30px Inter';
                ctx.fillStyle = '#073B4C'; /* Dark text for contrast on white circle */
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Upload', circleX, circleY - 20);
                ctx.fillText('Your Photo', circleX, circleY + 20);
                ctx.restore();
            }

            // Add decorative circles/lines (more prominent)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; /* Slightly more opaque */
            ctx.lineWidth = 6; /* Slightly thicker */
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius + 20, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius + 40, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath(); /* Added another circle */
            ctx.arc(circleX, circleY, circleRadius + 60, 0, Math.PI * 2);
            ctx.stroke();
            
            // Banner at the bottom
            const bannerHeight = 80;
            const bannerY = canvas.height - bannerHeight;
            const bannerTextLine1 = "Join me in this journey by visiting:";
            const bannerTextLine2 = "thetechhut.co/apprenticeship"; // The actual link text
            const bannerDates = "July 7th - August 31st"; // Apprenticeship dates

            ctx.fillStyle = '#093e76'; // Dark blue for banner background
            ctx.fillRect(0, bannerY, canvas.width, bannerHeight);

            ctx.font = 'bold 22px Inter'; // Adjust font size as needed
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(bannerTextLine1, canvas.width / 2, bannerY + bannerHeight / 2 - 20); 

            ctx.font = 'bold 22px Inter'; 
            ctx.fillStyle = '#d6a811'; // Brand Yellow for the link
            ctx.fillText(bannerTextLine2, canvas.width / 2, bannerY + bannerHeight / 2 + 5); 

            ctx.font = 'normal 18px Inter'; // Font for dates
            ctx.fillStyle = '#ffffff';
            ctx.fillText(bannerDates, canvas.width / 2, bannerY + bannerHeight / 2 + 30); 

            ctx.restore(); // Restore the context after clipping for the entire canvas content
        }
</script>
</body>
