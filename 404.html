<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="That page doesn't exist on The Tech Hut. Find our apprenticeship, blog, daily Kenyan tech digest and remote job board instead.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#06D6A0">
  <link rel="icon" type="image/png" href="/assets/img/the_tech_hut_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --green:#06D6A0; --green-dark:#05b384; --mint:#91FBBF; --ink:#073B4C; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px 20px; text-align:center; color:#fff;
      font-family:"Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:#093E76 linear-gradient(221deg, #093E76 22%, #333 80%) fixed;
    }
    img.logo { width:72px; height:72px; border-radius:50%; margin-bottom:28px; }
    .code { font-size:clamp(64px,16vw,120px); font-weight:800; line-height:1; letter-spacing:-.02em;
      background:linear-gradient(-45deg, var(--mint), var(--green));
      background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
    h1 { font-size:clamp(20px,4vw,28px); font-weight:700; margin:8px 0 12px; }
    p { max-width:30rem; font-weight:300; line-height:1.7; color:rgba(250,255,251,.72); margin-bottom:32px; }
    .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
    .links a {
      font-size:14px; font-weight:600; text-decoration:none; color:#fff;
      border:1px solid rgba(46,204,113,.5); border-radius:9999px; padding:11px 22px;
      transition:background .25s ease, border-color .25s ease, transform .25s ease;
    }
    .links a:hover { background:rgba(6,214,160,.16); border-color:var(--green); transform:translateY(-2px); }
    .links a.primary { background:var(--green); border-color:var(--green); color:#053; }
    .links a.primary:hover { background:var(--mint); }
    a:focus-visible { outline:2px solid var(--mint); outline-offset:3px; }
    @media (prefers-reduced-motion: reduce) { .links a { transition:none; } }
  </style>
</head>
<body>
  <img class="logo" src="/assets/img/the_tech_hut_logo.png" alt="The Tech Hut logo" width="72" height="72">
  <div class="code">404</div>

    <a href="/blog/">Blog</a>
    <a href="/blog/daily/">Daily Savannah</a>

  </div>
</body>
</html>
