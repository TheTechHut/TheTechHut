    <script>

            // Sample blog post data with 'likes' count
            const blogPosts = [
                {

                    author: "The Tech Hut",
                    date: "Updated daily",
                    image: "https://images.unsplash.com/photo-1741991110666-88115e724741?q=80&w=800&auto=format&fit=crop",
                    likes: 99,
                    url: "/blog/daily/"
                },
                // DAILY:START — generated by scripts/build_daily.py, do not edit by hand
                {

                    title: "Meta starts charging Kenyan businesses for every WhatsApp reply",
                    excerpt: "Meta puts a price on the business chat window Kenyan banks and retailers have leaned on for free, Nairobi applies to join the bloc writing the world's digital trade rules, and the half-year books show how much of Kenyan banking has already moved onto the phone.",
                    author: "The Daily Savannah",
                    date: "August 29, 2026",
                    image: "https://images.unsplash.com/photo-1739271933163-8dcc7c8e8a3e?q=80&w=800&auto=format&fit=crop",

                },
                {
                    id: "daily-2026-08-28",
                    title: "CA brings Uber, Bolt and Glovo parcel deliveries under licence",
                    excerpt: "A regulator draws new lines around the delivery apps, the grid runs perilously thin, and Kenya edges toward the world's main cybercrime treaty \u2014 a heavy day for the rules and the wires underneath the ecosystem.",
                    author: "The Daily Savannah",
                    date: "August 28, 2026",
                    image: "https://images.unsplash.com/photo-1741991110666-88115e724741?q=80&w=800&auto=format&fit=crop",
                    likes: 0,
                    url: "/blog/daily/2026-08-28/"
                },
                {
                    id: "daily-2026-08-27",
                    title: "Kenya slips to third in Africa's startup funding table",
                    excerpt: "Welcome to the first edition: the stories shaping Kenyan tech this season, from a shake-up in Africa's funding league table to M-Pesa's biggest platform overhaul yet. A fresh digest lands here every evening at 9.",
                    author: "The Daily Savannah",
                    date: "August 27, 2026",
                    image: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=800&auto=format&fit=crop",
                    likes: 0,
                    url: "/blog/daily/2026-08-27/"
                },
                // DAILY:END
                {
                    id: 1,
                    title: "Demystifying Blockchain Technology",
                    content: ["A blockchain is, at its core, a shared ledger that no single party controls. Every transaction is grouped into a block, cryptographically linked to the one before it, and copied across thousands of computers - which is why tampering with one record means rewriting them all.", "In this guide we unpack how consensus mechanisms like proof-of-work and proof-of-stake actually work, what smart contracts make possible, and where blockchain genuinely adds value beyond cryptocurrency - from supply chains to land registries here in Kenya."],
                    excerpt: "An easy-to-understand guide to the world of decentralized ledgers and cryptocurrencies.",
                    author: "John Smith",
                    date: "April 1, 2024",
                    image: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=800&auto=format&fit=crop",
                    likes: 15
                },
                {
                    id: 2,
                    title: "Full Stack Development in 2024",
                    content: ["The modern full-stack developer's toolkit keeps consolidating: TypeScript across the stack, React or Vue on the front end, Node or serverless functions behind an API, and a managed database underneath.", "We walk through the skills that matter most this year - component-driven UI, API design, CI/CD basics, and enough cloud literacy to ship confidently - plus a practical learning path for each."],

                {

                    content: ["Machine learning sounds intimidating until you train your first model. With Python, scikit-learn, and a clean dataset, you can go from raw CSV to working predictions in an afternoon.", "This tutorial walks through the full loop - loading data with pandas, splitting train and test sets, fitting a classifier, and honestly evaluating how well it performs - with all the code included."],

                    likes: 45

                {
                    id: 6,
                    title: "The Impact of 5G on IoT",
                    content: ["5G isn't just faster phones - its low latency and massive device density are what the Internet of Things has been waiting for. Think thousands of sensors per square kilometre reporting in near real time.", "We explore what that unlocks for smart agriculture, logistics, and city infrastructure in East Africa, and the practical hurdles - coverage, power, and cost - that still stand in the way."],

                    date: "March 15, 2024",
                    image: "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?q=80&w=800&auto=format&fit=crop",
                    likes: 38
                },
            ];

            const container = document.getElementById('blog-posts-container');
            const featuredContainer = document.getElementById('featured-post-container');

            // Find the blog post with the most likes to make it the featured post
            const featuredPost = blogPosts.reduce((prev, current) => {
                return (prev.likes > current.likes) ? prev : current;
            });

            // Function to render the featured post dynamically
            function renderFeaturedPost(post) {
                // Encode title and author for a clean URL
                const titleEncoded = encodeURIComponent(post.title);
                const authorEncoded = encodeURIComponent(post.author);
                const href = post.url || `/blog?title=${titleEncoded}&author=${authorEncoded}`;

                featuredContainer.innerHTML = `
                    <a href="${href}" class="flex flex-col md:flex-row w-full transition-transform transform hover:scale-105 duration-300">
                        <div class="md:w-1/2 p-6 md:p-10 flex flex-col justify-center">

                            <h3 class="text-2xl font-bold text-gray-900 mb-3">${post.title}</h3>
                            <p class="text-gray-600 mb-4">${post.excerpt}</p>
                            <div class="flex items-center text-gray-500 text-sm">
                                <span>By ${post.author}</span>
                                <span class="mx-2">•</span>
                                <span>${post.date}</span>
                                <span class="mx-2">•</span>
                                <span data-live-likes="${window.TTHReactions.slug(post.title)}">0 Likes</span>
                            </div>
                        </div>
                        <div class="md:w-1/2">
                            <img src="${post.image}" alt="Featured blog post image" class="w-full h-full object-cover">
                        </div>
                    </a>
                `;
            }

            // Function to create a blog post card
            function createBlogPostCard(post) {
                // Encode title and author for a clean URL
                const titleEncoded = encodeURIComponent(post.title);
                const authorEncoded = encodeURIComponent(post.author);
                const href = post.url || `/blog?title=${titleEncoded}&author=${authorEncoded}`;
                
                const article = document.createElement('a');
                article.href = href; // Making the entire card a link
                article.className = 'card overflow-hidden block transition-transform transform hover:scale-105 duration-300';
                article.innerHTML = `
                    <img src="${post.image}" alt="Image for ${post.title}" class="w-full h-48 object-cover">
                    <div class="p-6">
                        <h4 class="text-xl font-bold text-gray-900 mb-2">${post.title}</h4>
                        <p class="text-gray-600 text-sm mb-4">${post.excerpt}</p>
                        <div class="flex items-center text-gray-500 text-xs">
                            <span>By ${post.author}</span>
                            <span class="mx-2">•</span>
                            <span>${post.date}</span>
                            <span class="mx-2">•</span>
                            <span data-live-likes="${window.TTHReactions.slug(post.title)}">0 Likes</span>
                        </div>
                    </div>
                `;
                return article;
            }

            // Render a single post view for dynamic URLs like /blog/?title=...&author=...
            function setMeta(sel, val) {
                const el = document.querySelector(sel);
                if (el) el.setAttribute('content', val);
            }
            function renderSinglePost(post) {
                document.title = `${post.title} | The Tech Hut Blog`;
                setMeta('meta[name="description"]', post.excerpt);
                setMeta('meta[property="og:title"]', post.title);
                setMeta('meta[property="og:description"]', post.excerpt);
                setMeta('meta[property="og:type"]', 'article');
                setMeta('meta[property="og:url"]', location.href);
                setMeta('meta[property="og:image"]', post.image);
                setMeta('meta[name="twitter:title"]', post.title);
                setMeta('meta[name="twitter:description"]', post.excerpt);
                setMeta('meta[name="twitter:image"]', post.image);
                const hero = document.querySelector('section.min-h-screen');
                if (hero) hero.style.display = 'none';
                const main = document.querySelector('main');
                const paragraphs = (post.content && post.content.length ? post.content : [post.excerpt])
                    .map(p => `<p class="text-gray-600 leading-relaxed mb-5">${p}</p>`).join('');
                main.innerHTML = `
                    <article class="max-w-3xl mx-auto">
                        <a href="/blog/" class="inline-block mb-6 text-sm font-semibold text-[#06D6A0] hover:text-[#073B4C] transition duration-300">&larr; Back to all blogs</a>
                        <span class="block text-sm font-semibold text-[#06D6A0] uppercase mb-2">The Tech Hut Blog</span>
                        <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-4">${post.title}</h1>
                        <div class="flex items-center text-gray-500 text-sm mb-8">
                            <span>By ${post.author}</span>
                            <span class="mx-2">&bull;</span>
                            <span>${post.date}</span>
                            <span class="mx-2">&bull;</span>
                            <span data-live-likes="${window.TTHReactions.slug(post.title)}">0 Likes</span>
                        </div>
                        <div id="post-reactions" class="mb-8"></div>
                        <img src="${post.image}" alt="Image for ${post.title}" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-lg mb-8">
                        ${paragraphs}
                        <a href="/blog/" class="inline-block mt-4 text-sm font-semibold text-[#06D6A0] hover:text-[#073B4C] transition duration-300">&larr; Back to all blogs</a>
                    </article>
                `;
                window.scrollTo(0, 0);
                if (window.TTHReactions) {
                    window.TTHReactions.attach(document.getElementById('post-reactions'), window.TTHReactions.slug(post.title));
                }
            }

            // Route: single post view when ?title= is present, otherwise the normal listing
            const urlParams = new URLSearchParams(window.location.search);
            const requestedTitle = urlParams.get('title');
            const requestedPost = requestedTitle
                ? blogPosts.find(p => p.title.toLowerCase() === requestedTitle.toLowerCase())
                : null;

            if (requestedPost && requestedPost.url) {
                window.location.replace(requestedPost.url);
            } else if (requestedPost) {
                renderSinglePost(requestedPost);
            } else {
                renderFeaturedPost(featuredPost);
                blogPosts.forEach(post => {
                    container.appendChild(createBlogPostCard(post));
                });
            }

            // Live like counts: each card shows the real total of reactions on that post
            if (window.TTHReactions && window.TTHReactions.watchTotal) {
                document.querySelectorAll('[data-live-likes]').forEach(el => {
                    window.TTHReactions.watchTotal(el.getAttribute('data-live-likes'), n => {
                        el.textContent = `${n} ${n === 1 ? 'Like' : 'Likes'}`;
                    });
                });
            }
        });
    </script>
<script>
(function () {
  // ── The Tech Hut anonymous reactions ─────────────────────────────────────────
  // To sync reaction counts for ALL visitors, paste your Firebase web app config
  // below (Firebase console → Project settings → Your apps → Add web app → config
  // object) and enable Realtime Database with the rules from the setup notes.
  // Until then, reactions still work but are saved per visitor on their device.
  var FIREBASE_CONFIG = null;

  var EMOJIS = [["like", "👍"], ["love", "❤️"], ["fire", "🔥"]];
  var PAGE = location.pathname.indexOf("/blog/daily") === 0 ? "daily" : "blog";
  var db = null, ready = null;

  function slug(t) {
    return (t || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  }
  function store(k, v) {
    try {
      if (v === undefined) return JSON.parse(localStorage.getItem(k) || "{}");
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) { return {}; }
  }
  function loadFirebase() {
    if (!FIREBASE_CONFIG) return Promise.resolve(null);
    if (ready) return ready;
    ready = new Promise(function (res) {
      var n = 0;
      ["firebase-app-compat", "firebase-database-compat"].forEach(function (m) {
        var s = document.createElement("script");
        s.src = "https://www.gstatic.com/firebasejs/10.12.2/" + m + ".js";
        s.onload = function () {
          if (++n === 2) {
            try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); } catch (e) { db = null; }
            res(db);
          }
        };
        s.onerror = function () { res(null); };
        document.head.appendChild(s);
      });
    });
    return ready;
  }
  function attach(container, id) {
    if (!container || !id || container.querySelector(".reactions")) return;
    var bar = document.createElement("div");
    bar.className = "reactions";
    var mine = store("tth-my-reactions");
    var counts = store("tth-local-counts");
    EMOJIS.forEach(function (pair) {
      var key = pair[0], face = pair[1];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", "React with " + key);
      var c = (counts[id] && counts[id][key]) || 0;
      btn.innerHTML = face + " <span>" + c + "</span>";
      if (mine[id] && mine[id][key]) btn.classList.add("on");
      btn.addEventListener("click", function () {
        var m = store("tth-my-reactions");
        m[id] = m[id] || {};
        var on = !m[id][key];
        m[id][key] = on;
        store("tth-my-reactions", m);
        btn.classList.toggle("on", on);
        if (db) {
          db.ref("reactions/" + PAGE + "/" + id + "/" + key)
            .transaction(function (v) { return Math.max(0, (v || 0) + (on ? 1 : -1)); });
        } else {
          var cs = store("tth-local-counts");
          cs[id] = cs[id] || {};
          cs[id][key] = Math.max(0, (cs[id][key] || 0) + (on ? 1 : -1));
          store("tth-local-counts", cs);
          btn.querySelector("span").textContent = cs[id][key];
        }
        try { document.dispatchEvent(new CustomEvent("tth-reactions-changed", { detail: id })); } catch (err) {}
      });
      bar.appendChild(btn);
    });
    container.appendChild(bar);
    loadFirebase().then(function (d) {
      if (!d) return;
      d.ref("reactions/" + PAGE + "/" + id).on("value", function (snap) {
        var v = snap.val() || {};
        bar.querySelectorAll("button").forEach(function (b, i) {
          b.querySelector("span").textContent = v[EMOJIS[i][0]] || 0;
        });
      });
    });
  }
  function totalFromLocal(id) {
    var cs = store("tth-local-counts");
    var v = cs[id] || {};
    var t = 0;
    for (var k in v) t += v[k] || 0;
    return t;
  }
  function watchTotal(id, cb) {
    cb(totalFromLocal(id));
    document.addEventListener("tth-reactions-changed", function (e) {
      if (e.detail === id) cb(totalFromLocal(id));
    });
    loadFirebase().then(function (d) {
      if (!d) return;
      d.ref("reactions/" + PAGE + "/" + id).on("value", function (snap) {
        var v = snap.val() || {}, t = 0;
        for (var k in v) t += v[k] || 0;
        cb(t);
      });
    });
  }
  window.TTHReactions = { attach: attach, slug: slug, watchTotal: watchTotal };
})();
</script>
</body>
</html>
