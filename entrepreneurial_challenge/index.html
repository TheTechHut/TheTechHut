<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/img/Logo.png" type="image/x-icon">
    <meta name="description" content="The Tech Hut is a leading Ed Tech and Talent Sourcing company based in Kenya.">
    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>
    <header>
        <div class="logo">
            <img src="../assets/img/Logo.png" alt="The Tech Hut">
            <p class="txt-gradient">The Tech Hut</p>
        </div>
    </header>
    <div class="container">
        <h1>The Entrepreneurial Challenge Ends in:</h1>
        <div class="timer">
            <div class="time-block">
                <span id="days">00</span>
                <p>Days</p>
            </div>
            <div class="time-block">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>
            <div class="time-block">
                <span id="minutes">00</span>
                <p>Minutes</p>
            </div>
            <div class="time-block">
                <span id="seconds">00</span>
                <p>Seconds</p>
            </div>
        </div>
    </div>
    <script src="script.js">

    </script>
</body>

</html>
